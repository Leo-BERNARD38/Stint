<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stint">
  <!-- « Le repère ». La barre est le temps tracé ; le trait minium est l'arrêt.
       Un span souple, un terminus dur : c'est toute la thèse de l'app en deux
       formes. Marges gauche et droite égales (5,8), donc la marque est centrée
       et ne penche d'aucun côté.
       Couleurs en dur : un favicon n'a pas accès au CSS de la page. -->
  <style>
    .sq { fill: #131a20 } .bar { fill: #e8e5dc } .stop { fill: #cc3823 }
    @media (prefers-color-scheme: dark) {
      .sq { fill: #f2eee3 } .bar { fill: #131211 } .stop { fill: #ff6a4a }
    }
  </style>
  <rect class="sq" x="1.5" y="1.5" width="29" height="29" rx="7.6"/>
  <rect class="bar" x="5.8" y="12.2" width="15.2" height="7.6" rx="3.8"/>
  <rect class="stop" x="23" y="12.2" width="3.2" height="7.6" rx="1.2"/>
</svg>
